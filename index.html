<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Al-Rasekhoon — Family Register</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <div class="masthead-brand">
      <img src="assets/logo.png" alt="Al-Rasekhoon" class="masthead-logo" onerror="this.style.display='none'" />
      <div>
        <h1 class="masthead-title">Al-Rasekhoon <em>Family Register</em></h1>
        <p class="masthead-sub">Students — live record</p>
      </div>
    </div>
    <nav class="masthead-nav">
      <a class="btn btn-red" href="submit.html">+ Add / update a record</a>
      <a class="btn btn-ghost" href="admin.html">Admin</a>
    </nav>
  </div>
</header>

<main class="page">

  <div class="toolbar">
    <input class="search-input" id="search" type="text"
      placeholder="Search by student, father's name, family chain, institute…" />
    <select class="chip-select" id="familyFilter">
      <option value="">All family chains</option>
    </select>
    <select class="chip-select" id="classFilter">
      <option value="">All classes</option>
    </select>
    <select class="chip-select" id="statusFilter">
      <option value="">Any status</option>
    </select>
    <select class="chip-select" id="marksFilter">
      <option value="">Marks: any</option>
      <option value="recorded">Marks recorded</option>
      <option value="missing">Marks missing</option>
    </select>
    <select class="chip-select" id="contactFilter">
      <option value="">Contact: any</option>
      <option value="recorded">Contact recorded</option>
      <option value="missing">Contact missing</option>
    </select>
    <button class="btn btn-ghost btn-sm" id="clearFilters" hidden>Clear filters</button>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div id="content">
    <div class="card" style="padding:24px;">
      <div class="skeleton" style="width:40%;margin-bottom:10px;"></div>
      <div class="skeleton" style="width:70%;margin-bottom:10px;"></div>
      <div class="skeleton" style="width:55%;"></div>
    </div>
  </div>

  <p class="footer-note">Spotted a mistake, or a Contact # that's missing? Use "Add / update a record" above —
    changes go to the admin for approval before they appear here.</p>
</main>

<script type="module" src="assets/view.js"></script>
</body>
</html>
